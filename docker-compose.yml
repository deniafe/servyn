services:
  postgres:
    build:
      dockerfile_inline: |
        FROM postgis/postgis:16-3.4
        RUN apt-get update && apt-get install -y --no-install-recommends postgresql-16-pgvector && rm -rf /var/lib/apt/lists/*
    container_name: servyn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: servyn
      POSTGRES_PASSWORD: servyn_local_password
      POSTGRES_DB: servyn
    ports:
      - "5432:5432"
    volumes:
      - servyn_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servyn -d servyn"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: servyn-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - servyn_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: servyn-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: servyn
      MINIO_ROOT_PASSWORD: servyn_local_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - servyn_minio:/data

volumes:
  servyn_pgdata:
  servyn_redis:
  servyn_minio:
